<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Logo Wall</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
  color: #222;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

body {
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 720px;
  background: #fff;
  overflow: hidden;
}

.logo {
  position: absolute;
  width: clamp(76px, 7vw, 138px);
  height: clamp(32px, 5vh, 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  overflow: hidden;
  padding: 2px 3px;
}

.logo img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

.map-wrap {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  width: min(28vw, 390px);
  z-index: 4;
  pointer-events: none;
}

.map {
  width: 100%;
  display: block;
}

/* 手机端不再切换卡片式，保持和 iPad/桌面一样的围绕地图布局 */
@media (max-width: 900px) {
  body {
    overflow: hidden;
  }

  .stage {
    display: block;
    min-height: 100svh;
  }

  .logo {
    width: clamp(52px, 13vw, 92px);
    height: clamp(24px, 7vw, 46px);
  }

  .map-wrap {
    width: min(38vw, 210px);
  }
}

@media (max-width: 420px) {
  .logo {
    width: clamp(46px, 14vw, 82px);
    height: clamp(22px, 7vw, 40px);
  }

  .map-wrap {
    width: min(42vw, 180px);
  }
}
</style>
</head>
