<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Logo Wall</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  color: #222;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

body {
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 700px;
  background: #ffffff;
  overflow: hidden;
}

.wall {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(11, minmax(0, 1fr));
  grid-template-rows: repeat(10, minmax(0, 1fr));
  padding: clamp(18px, 2vw, 28px);
  column-gap: clamp(10px, 0.95vw, 18px);
  row-gap: clamp(8px, 1vh, 14px);
  align-items: center;
  justify-items: center;
  z-index: 2;
}

.logo {
  width: 100%;
  max-width: clamp(80px, 7.1vw, 138px);
  height: clamp(32px, 4.8vh, 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 2px 4px;
}

.logo img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

.map-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(21vw, 290px);
  z-index: 1;
  pointer-events: none;
}

.map {
  width: 100%;
  display: block;
}

.slot-r1{grid-row:1;}
.slot-r2{grid-row:2;}
.slot-r3{grid-row:3;}
.slot-r4{grid-row:4;}
.slot-r5{grid-row:5;}
.slot-r6{grid-row:6;}
.slot-r7{grid-row:7;}
.slot-r8{grid-row:8;}
.slot-r9{grid-row:9;}
.slot-r10{grid-row:10;}
.slot-c1{grid-column:1;}
.slot-c2{grid-column:2;}
.slot-c3{grid-column:3;}
.slot-c4{grid-column:4;}
.slot-c5{grid-column:5;}
.slot-c6{grid-column:6;}
.slot-c7{grid-column:7;}
.slot-c8{grid-column:8;}
.slot-c9{grid-column:9;}
.slot-c10{grid-column:10;}
.slot-c11{grid-column:11;}

@media (max-width: 1100px) {
  .wall {
    padding: 14px;
    column-gap: 8px;
    row-gap: 8px;
  }

  .logo {
    max-width: clamp(58px, 7.8vw, 100px);
    height: clamp(24px, 4.2vh, 44px);
  }

  .map-wrap {
    width: min(24vw, 220px);
  }
}

@media (max-width: 700px) {
  .wall {
    padding: 10px;
    column-gap: 5px;
    row-gap: 6px;
  }

  .logo {
    max-width: clamp(40px, 8.4vw, 72px);
    height: clamp(18px, 3.2vh, 30px);
  }

  .map-wrap {
    width: min(28vw, 150px);
  }
}


.data-panel {
  position: fixed;
  left: 50%;
  bottom: max(8px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(1080px, calc(100vw - 22px));
  max-height: 42vh;
  z-index: 9999;
  background: rgba(255,255,255,.97);
  border: 1px solid rgba(0,0,0,.14);
  border-radius: 16px;
  box-shadow: 0 8px 28px rgba(0,0,0,.16);
  overflow: hidden;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

.data-toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid rgba(0,0,0,.08);
}

.data-toolbar input {
  flex: 1;
  min-width: 0;
  border: 1px solid rgba(0,0,0,.18);
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 14px;
  outline: none;
}

.data-count {
  flex: 0 0 auto;
  font-size: 12px;
  color: #666;
  white-space: nowrap;
}

.table-wrap {
  max-height: calc(42vh - 56px);
  overflow: auto;
}

.company-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  color: #111;
}

.company-table th,
.company-table td {
  padding: 9px 10px;
  border-bottom: 1px solid rgba(0,0,0,.07);
  text-align: left;
  white-space: nowrap;
}

.company-table th {
  position: sticky;
  top: 0;
  background: #f7f7f7;
  z-index: 1;
  font-weight: 700;
}

.company-table tr {
  cursor: pointer;
}

.company-table tr:hover {
  background: rgba(0,0,0,.045);
}

.company-table td.intro-cell {
  max-width: 360px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.logo.search-hit {
  outline: 3px solid #ff3b30;
  outline-offset: 6px;
  border-radius: 10px;
  z-index: 9998;
  animation: hitPulse 1.2s ease-in-out 2;
}

@keyframes hitPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

.detail-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(0,0,0,.32);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.detail-card {
  width: min(560px, 100%);
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 18px 50px rgba(0,0,0,.28);
  overflow: hidden;
}

.detail-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid rgba(0,0,0,.08);
}

.detail-title {
  font-size: 20px;
  font-weight: 800;
}

.detail-close {
  border: 0;
  background: rgba(0,0,0,.06);
  border-radius: 999px;
  padding: 7px 11px;
  cursor: pointer;
}

.detail-body {
  padding: 16px 18px 18px;
  display: grid;
  gap: 10px;
  font-size: 14px;
}

.detail-row {
  display: grid;
  grid-template-columns: 86px 1fr;
  gap: 10px;
}

.detail-label {
  color: #666;
}

@media (max-width: 700px) {
  .data-panel {
    max-height: 45vh;
    border-radius: 14px;
  }
  .table-wrap {
    max-height: calc(45vh - 55px);
  }
  .company-table {
    font-size: 12px;
  }
  .company-table th,
  .company-table td {
    padding: 8px 9px;
  }
  .company-table td.intro-cell,
  .company-table th:nth-child(6),
  .company-table td:nth-child(6) {
    display: none;
  }
}


/* compact override: default only search bar, table opens on demand */
.data-panel {
  max-height: none !important;
  border-radius: 999px !important;
  transition: border-radius .18s ease, max-height .18s ease;
}

.data-panel.open {
  max-height: 34vh !important;
  border-radius: 16px !important;
}

.data-toolbar {
  border-bottom: 0 !important;
}

.data-panel.open .data-toolbar {
  border-bottom: 1px solid rgba(0,0,0,.08) !important;
}

.table-wrap {
  display: none !important;
  max-height: calc(34vh - 56px) !important;
}

.data-panel.open .table-wrap {
  display: block !important;
}

.table-toggle {
  flex: 0 0 auto;
  border: 1px solid rgba(0,0,0,.18);
  background: #fff;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}

.table-toggle:active {
  transform: scale(.98);
}

@media (max-width: 700px) {

    max-height: calc(36vh - 55px) !important;
  }

    padding: 8px 10px;

  }
}

/* top story header */
.hero-story {
  width: min(1120px, calc(100vw - 24px));
  margin: 0 auto 18px;
  display: grid;
  grid-template-columns: minmax(0, 1.04fr) minmax(260px, .96fr);

const sectionSearch = document.getElementById('companySectionSearch');
const sectionBody = document.getElementById('companySectionBody');
const sectionCount = document.getElementById('companySectionCount');
const detailModal = document.getElementById('companyDetailModal');

function norm(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, '');
}

function clearHits() {
  document.querySelectorAll('.logo.search-hit').forEach(el => el.classList.remove('search-hit'));
}

function focusLogo(file) {
  clearHits();
  if (!file) return;
  const img = document.querySelector(`img[src$="${file}"]`);
  if (!img) return;
  const logo = img.closest('.logo');
  if (!logo) return;
  logo.classList.add('search-hit');
  logo.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  setTimeout(() => logo.classList.remove('search-hit'), 2600);
}

function showDetail(item) {
  document.getElementById('companyDetailTitle').textContent = item.name || '—';
  document.getElementById('companyDetailFameRank').textContent = `第 ${item.fameRank || '—'} 名`;
  document.getElementById('companyDetailImpactRank').textContent = `第 ${item.impactRank || '—'} 名`;
  document.getElementById('companyDetailCode').textContent = item.code || '—';
  document.getElementById('companyDetailIndustry').textContent = item.industry || '—';
  document.getElementById('companyDetailFame').textContent = `${item.fameScore || '—'} / 10`;
  document.getElementById('companyDetailImpact').textContent = `${item.impactScore || '—'} / 10`;
  document.getElementById('companyDetailIntro').textContent = item.intro || '—';
  detailModal.style.display = 'flex';
  focusLogo(item.logo);
}

function renderCompanyTable() {
  const q = norm(sectionSearch.value);
  const rows = COMPANY_DATA
    .filter(item => {
      const hay = norm([item.name, item.code, item.industry, item.intro, item.source, item.fameRank, item.impactRank].join(' '));
      return !q || hay.includes(q);
    })
    .sort((a, b) => (a.fameRank || 9999) - (b.fameRank || 9999));

  sectionCount.textContent = `${rows.length} / ${COMPANY_DATA.length} 条`;

  sectionBody.innerHTML = rows.map(item => `
    <tr data-name="${item.name}">
      <td><span class="rank-pill">${item.fameRank || '—'}</span><span class="score-text">${item.fameScore || '—'}</span></td>
      <td><span class="rank-pill rank-impact">${item.impactRank || '—'}</span><span class="score-text">${item.impactScore || '—'}</span></td>
      <td>${item.name || '—'}</td>
      <td>${item.code || '—'}</td>
      <td>${item.industry || '—'}</td>
      <td class="intro-cell">${item.intro || '—'}</td>
    </tr>
  `).join('');

  sectionBody.querySelectorAll('tr').forEach(row => {
    row.addEventListener('click', () => {
      const item = rows.find(x => x.name === row.dataset.name);
      if (item) showDetail(item);
    });
  });
}

sectionSearch.addEventListener('input', renderCompanyTable);

document.getElementById('companyDetailClose').addEventListener('click', () => {
  detailModal.style.display = 'none';
});

detailModal.addEventListener('click', (e) => {
  if (e.target === detailModal) detailModal.style.display = 'none';
});


const logoPopover = document.getElementById('logoDetailPopover');
const logoPopoverClose = document.getElementById('logoPopoverClose');
const logoTitle = document.getElementById('logoPopoverTitle');
const logoFameRank = document.getElementById('logoPopoverFameRank');
const logoImpactRank = document.getElementById('logoPopoverImpactRank');
const logoFameScore = document.getElementById('logoPopoverFameScore');
const logoImpactScore = document.getElementById('logoPopoverImpactScore');
const logoCode = document.getElementById('logoPopoverCode');
const logoIndustry = document.getElementById('logoPopoverIndustry');
const logoIntro = document.getElementById('logoPopoverIntro');

const logoDataMap = new Map();
COMPANY_DATA.forEach(item => {
  if (item.logo) logoDataMap.set(item.logo, item);
});

const logoNameOverrides = {
  "logo-099.png": "佳明",
  "logo-100.png": "友嘉国际",
  "logo-101.png": "大润发",
  "logo-102.png": "宝岛眼镜",
  "logo-103.png": "震旦集团",
  "logo-104.png": "技嘉科技",
  "logo-105.png": "威克多",
  "logo-106.png": "妙洁",
  "logo-107.png": "巨大机械",
  "logo-108.png": "正新橡胶",
  "logo-109.png": "鸿海精密"
};

Object.entries(logoNameOverrides).forEach(([file, name]) => {
  if (!logoDataMap.has(file)) {
    const item = COMPANY_DATA.find(x => x.name === name);
    if (item) logoDataMap.set(file, item);
  }
});

let activeLogoEl = null;
let activeLogoItem = null;

function clearActiveLogo() {
  document.querySelectorAll('.wall .logo.active-logo').forEach(el => el.classList.remove('active-logo'));
}

function hideLogoPopover() {
  logoPopover.style.display = 'none';
  logoPopover.setAttribute('aria-hidden', 'true');
  clearActiveLogo();
  activeLogoEl = null;
  activeLogoItem = null;
}

function positionLogoPopover(anchorEl) {
  if (!anchorEl) return;
  const rect = anchorEl.getBoundingClientRect();
  const popRect = logoPopover.getBoundingClientRect();
  const gap = 14;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  let left = rect.right + gap;
  let top = rect.top + rect.height / 2 - popRect.height / 2;

  if (left + popRect.width > vw - 12) {
    left = rect.left - popRect.width - gap;
  }
  if (left < 12) {
    left = Math.min(Math.max(12, rect.left), vw - popRect.width - 12);
  }

  if (top < 12) top = 12;
  if (top + popRect.height > vh - 12) top = vh - popRect.height - 12;

  if (vw <= 700) {
    left = 9;
    top = rect.bottom + 10;
    if (top + popRect.height > vh - 8) {
      top = Math.max(8, rect.top - popRect.height - 10);
    }
  }

  logoPopover.style.left = `${Math.round(left)}px`;
  logoPopover.style.top = `${Math.round(top)}px`;
}

function fillLogoPopover(item) {
  logoTitle.textContent = item.name || '—';
  logoFameRank.textContent = item.fameRank ? `第 ${item.fameRank} 名` : '—';
  logoImpactRank.textContent = item.impactRank ? `第 ${item.impactRank} 名` : '—';
  logoFameScore.textContent = item.fameScore ? `${item.fameScore} / 10` : '—';
  logoImpactScore.textContent = item.impactScore ? `${item.impactScore} / 10` : '—';
  logoCode.textContent = item.code || '—';
  logoIndustry.textContent = item.industry || '—';
  logoIntro.textContent = item.intro || '—';
}

function showLogoPopover(item, logoEl) {
  if (!item || !logoEl) return;
  activeLogoItem = item;
  activeLogoEl = logoEl;
  clearActiveLogo();
  logoEl.classList.add('active-logo');
  fillLogoPopover(item);
  logoPopover.style.display = 'block';
  logoPopover.setAttribute('aria-hidden', 'false');
  positionLogoPopover(logoEl);
}

function bindLogoInteractions() {
  document.querySelectorAll('.wall .logo').forEach(logoEl => {
    const img = logoEl.querySelector('img');
    if (!img) return;
    const src = img.getAttribute('src') || '';
    const file = src.split('/').pop();
    const item = logoDataMap.get(file);
    if (!item) return;

    logoEl.setAttribute('data-company-name', item.name || '');
    logoEl.setAttribute('title', `${item.name || ''}｜点击查看详情`);
    logoEl.addEventListener('click', (e) => {
      e.stopPropagation();
      showLogoPopover(item, logoEl);
    });
  });
}

bindLogoInteractions();

logoPopoverClose.addEventListener('click', hideLogoPopover);

document.addEventListener('click', (e) => {
  if (!logoPopover.contains(e.target) && !e.target.closest('.wall .logo')) {
    hideLogoPopover();
  }
});

window.addEventListener('resize', () => {
  if (activeLogoEl && logoPopover.style.display === 'block') positionLogoPopover(activeLogoEl);
});

window.addEventListener('scroll', () => {
  if (activeLogoEl && logoPopover.style.display === 'block') positionLogoPopover(activeLogoEl);
}, { passive: true });


renderCompanyTable();
</script>

      <div class="logo-popover-stat">
        <div class="logo-popover-stat-label">知名度排名</div>
        <div id="logoPopoverFameRank" class="logo-popover-stat-value"></div>
      </div>
      <div class="logo-popover-stat">
        <div class="logo-popover-stat-label">影响力排名</div>
        <div id="logoPopoverImpactRank" class="logo-popover-stat-value"></div>
      </div>
      <div class="logo-popover-stat">
        <div class="logo-popover-stat-label">国际知名度</div>
        <div id="logoPopoverFameScore" class="logo-popover-stat-value"></div>
      </div>
      <div class="logo-popover-stat">
        <div class="logo-popover-stat-label">国际影响力</div>
        <div id="logoPopoverImpactScore" class="logo-popover-stat-value"></div>
      </div>
    </div>
    <div class="logo-popover-row"><div class="logo-popover-label">代码</div><div id="logoPopoverCode"></div></div>
    <div class="logo-popover-row"><div class="logo-popover-label">行业</div><div id="logoPopoverIndustry"></div></div>
    <div class="logo-popover-row"><div class="logo-popover-label">简介</div><div id="logoPopoverIntro" class="logo-popover-intro"></div></div>
    <div class="logo-popover-tip">点击 logo 可查看公司详情；点击空白处可关闭。</div>
  </div>
</div>

<script>
(function(){
const logoPopover = document.getElementById('logoDetailPopover');
const logoPopoverClose = document.getElementById('logoPopoverClose');
const logoTitle = document.getElementById('logoPopoverTitle');
const logoFameRank = document.getElementById('logoPopoverFameRank');
const logoImpactRank = document.getElementById('logoPopoverImpactRank');
const logoFameScore = document.getElementById('logoPopoverFameScore');
const logoImpactScore = document.getElementById('logoPopoverImpactScore');
const logoCode = document.getElementById('logoPopoverCode');
const logoIndustry = document.getElementById('logoPopoverIndustry');
const logoIntro = document.getElementById('logoPopoverIntro');

function showLogoPopover(item, logoEl) {
  if(!item || !logoEl) return;
  document.querySelectorAll('.wall .logo.active-logo').forEach(el=>el.classList.remove('active-logo'));
  logoEl.classList.add('active-logo');
  logoTitle.textContent = item.name || '—';
  logoFameRank.textContent = item.fameRank ? '第 ' + item.fameRank + ' 名' : '—';
  logoImpactRank.textContent = item.impactRank ? '第 ' + item.impactRank + ' 名' : '—';
  logoFameScore.textContent = item.fameScore ? item.fameScore + ' / 10' : '—';
  logoImpactScore.textContent = item.impactScore ? item.impactScore + ' / 10' : '—';
  logoCode.textContent = item.code || '—';
  logoIndustry.textContent = item.industry || '—';
  logoIntro.textContent = item.intro || '—';
  logoPopover.style.display = 'block';
  logoPopover.setAttribute('aria-hidden','false');
  const rect = logoEl.getBoundingClientRect();
  let left = rect.right + 14;
  let top = rect.top + rect.height/2 - logoPopover.offsetHeight/2;
  if(left + logoPopover.offsetWidth > window.innerWidth) left = rect.left - logoPopover.offsetWidth - 14;
  if(top < 12) top = 12;
  logoPopover.style.left = left+'px';
  logoPopover.style.top = top+'px';
}

logoPopoverClose.addEventListener('click',()=>{logoPopover.style.display='none';document.querySelectorAll('.wall .logo.active-logo').forEach(el=>el.classList.remove('active-logo'));});
document.addEventListener('click',e=>{if(!logoPopover.contains(e.target)&&!e.target.closest('.wall .logo')) logoPopover.style.display='none';});
window.addEventListener('resize',()=>{document.querySelectorAll('.wall .logo.active-logo').forEach(el=>{const evt={target:el}; showLogoPopover({name:el.dataset.name,code:el.dataset.code,industry:el.dataset.industry,intro:el.dataset.intro,fameRank:el.dataset.fameRank,impactRank:el.dataset.impactRank,fameScore:el.dataset.fameScore,impactScore:el.dataset.impactScore}, el)})});
window.addEventListener('scroll',()=>{document.querySelectorAll('.wall .logo.active-logo').forEach(el=>{showLogoPopover({name:el.dataset.name,code:el.dataset.code,industry:el.dataset.industry,intro:el.dataset.intro,fameRank:el.dataset.fameRank,impactRank:el.dataset.impactRank,fameScore:el.dataset.fameScore,impactScore:el.dataset.impactScore}, el)})});

document.querySelectorAll('.wall .logo').forEach(el=>{
  el.style.cursor='pointer';
  const item={
    name: el.dataset.name,
    code: el.dataset.code,
    industry: el.dataset.industry,
    intro: el.dataset.intro,
    fameRank: el.dataset.fameRank,
    impactRank: el.dataset.impactRank,
    fameScore: el.dataset.fameScore,
    impactScore: el.dataset.impactScore
  };
  el.addEventListener('click',e=>{e.stopPropagation(); showLogoPopover(item,el);});
});
})();
</script>
</body>
</html>
