<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Logo Wall</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  color: #222;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

body {
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 700px;
  background: #ffffff;
  overflow: hidden;
}

.wall {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(11, minmax(0, 1fr));
  grid-template-rows: repeat(10, minmax(0, 1fr));
  padding: clamp(18px, 2vw, 28px);
  column-gap: clamp(10px, 0.95vw, 18px);
  row-gap: clamp(8px, 1vh, 14px);
  align-items: center;
  justify-items: center;
  z-index: 2;
}

.logo {
  width: 100%;
  max-width: clamp(80px, 7.1vw, 138px);
  height: clamp(32px, 4.8vh, 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 2px 4px;
}

.logo img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

.map-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(21vw, 290px);
  z-index: 1;
  pointer-events: none;
}

.map {
  width: 100%;
  display: block;
}

.slot-r1{grid-row:1;}
.slot-r2{grid-row:2;}
.slot-r3{grid-row:3;}
.slot-r4{grid-row:4;}
.slot-r5{grid-row:5;}
.slot-r6{grid-row:6;}
.slot-r7{grid-row:7;}
.slot-r8{grid-row:8;}
.slot-r9{grid-row:9;}
.slot-r10{grid-row:10;}
.slot-c1{grid-column:1;}
.slot-c2{grid-column:2;}
.slot-c3{grid-column:3;}
.slot-c4{grid-column:4;}
.slot-c5{grid-column:5;}
.slot-c6{grid-column:6;}
.slot-c7{grid-column:7;}
.slot-c8{grid-column:8;}
.slot-c9{grid-column:9;}
.slot-c10{grid-column:10;}
.slot-c11{grid-column:11;}

@media (max-width: 1100px) {
  .wall {
    padding: 14px;
    column-gap: 8px;
    row-gap: 8px;
  }

  .logo {
    max-width: clamp(58px, 7.8vw, 100px);
    height: clamp(24px, 4.2vh, 44px);
  }

  .map-wrap {
    width: min(24vw, 220px);
  }
}

@media (max-width: 700px) {
  .wall {
    padding: 10px;
    column-gap: 5px;
    row-gap: 6px;
  }

  .logo {
    max-width: clamp(40px, 8.4vw, 72px);
    height: clamp(18px, 3.2vh, 30px);
  }

  .map-wrap {
    width: min(28vw, 150px);
  }
}
</style>
</head>
