<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Taiwan Logo Wall</title>
<style>
:root {
  --desktop-cols:24; --desktop-rows:12;
  --logo-w:clamp(78px,4.9vw,158px); --logo-h:clamp(34px,2.45vw,66px);
  --gap-x:clamp(6px,.65vw,13px); --gap-y:clamp(6px,.75vw,13px);
  --map-w:min(26vw,405px);
  --mobile-logo-h:88px; --mobile-box-h:118px; --mobile-gap:14px; --mobile-map-w:min(74vw,330px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#222;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{overflow:hidden}
.desktop-stage{position:relative;width:100vw;height:100vh;padding:14px;background:#fff;overflow:hidden}
.desktop-grid{position:relative;display:grid;width:100%;height:100%;grid-template-columns:repeat(var(--desktop-cols),minmax(0,1fr));grid-template-rows:repeat(var(--desktop-rows),minmax(0,1fr));column-gap:var(--gap-x);row-gap:var(--gap-y);align-items:center;justify-items:center}
.logo{width:100%;max-width:var(--logo-w);height:var(--logo-h);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px 3px}
.logo img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;image-rendering:-webkit-optimize-contrast;filter:drop-shadow(0 0 2px rgba(0,0,0,.03))}
.desktop-map-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--map-w);z-index:5;pointer-events:none}
.desktop-map{width:100%;display:block}
.mobile-stage{display:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#fff;min-height:100vh}
.mobile-map-wrap{display:flex;align-items:center;justify-content:center;padding:0 0 18px;margin-bottom:8px}
.mobile-map{width:var(--mobile-map-w);max-width:100%;display:block}
.mobile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--mobile-gap);align-items:stretch}
.mobile-card{min-height:var(--mobile-box-h);border:1px solid rgba(0,0,0,.08);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.mobile-card img{max-width:100%;max-height:var(--mobile-logo-h);width:auto;height:auto;object-fit:contain;display:block;image-rendering:-webkit-optimize-contrast}
@media(max-width:900px){body{overflow:auto}.desktop-stage{display:none}.mobile-stage{display:block}}
@media(max-width:420px){.mobile-grid{grid-template-columns:1fr}.mobile-card{min-height:124px}.mobile-card img{max-height:94px}}
</style>
</head>
<body>
<main class="desktop-stage">
  <section class="desktop-grid" id="desktopGrid"></section>
  <div class="desktop-map-wrap"><img class="desktop-map" src="./assets/taiwan-map.jpg" alt="Taiwan map" /></div>
</main>
<main class="mobile-stage">
  <div class="mobile-map-wrap"><img class="mobile-map" src="./assets/taiwan-map.jpg" alt="Taiwan map" /></div>
  <section class="mobile-grid" id="mobileGrid"></section>
</main>
<script>

const DESKTOP_POSITIONS=[[1, 1], [1, 3], [1, 5], [1, 7], [1, 9], [1, 11], [1, 13], [1, 15], [1, 17], [1, 19], [1, 21], [1, 23], [1, 24], [1, 2], [1, 4], [1, 6], [1, 8], [1, 10], [1, 12], [1, 14], [1, 16], [1, 18], [1, 20], [1, 22], [2, 1], [2, 3], [2, 5], [2, 7], [2, 9], [2, 11], [2, 13], [2, 15], [2, 17], [2, 19], [2, 21], [2, 23], [2, 24], [2, 2], [2, 4], [2, 6], [2, 8], [2, 10], [2, 12], [2, 14], [2, 16], [2, 18], [2, 20], [2, 22], [12, 1], [12, 3], [12, 5], [12, 7], [12, 9], [12, 11], [12, 13], [12, 15], [12, 17], [12, 19], [12, 21], [12, 23], [12, 24], [12, 2], [12, 4], [12, 6], [12, 8], [12, 10], [12, 12], [12, 14], [12, 16], [12, 18], [12, 20], [12, 22], [11, 1], [11, 3], [11, 5], [11, 7], [11, 9], [11, 11], [11, 13], [11, 15], [11, 17], [11, 19], [11, 21], [11, 23], [11, 24], [11, 2], [11, 4], [11, 6], [11, 8], [11, 10], [11, 12], [11, 14], [11, 16], [11, 18]];
const desktopGrid=document.getElementById('desktopGrid'), mobileGrid=document.getElementById('mobileGrid');
LOGOS.forEach((src,i)=>{
  const pos=DESKTOP_POSITIONS[i];
  if(pos){
    const div=document.createElement('div');
    div.className='logo';
    div.style.gridRow=pos[0];
    div.style.gridColumn=pos[1];
    const img=document.createElement('img');
    img.src=src;
    img.alt=`logo ${i+1}`;
    div.appendChild(img);
    desktopGrid.appendChild(div);
  }
  const card=document.createElement('div');
  card.className='mobile-card';
  const img2=document.createElement('img');
  img2.src=src;
  img2.alt=`logo ${i+1}`;
  card.appendChild(img2);
  mobileGrid.appendChild(card);
});
</script>
</body>
</html>
