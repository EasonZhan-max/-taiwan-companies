<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taiwan Logo Wall Preview</title>
  <style>
    :root {
      --bg: #03050a;
      --logo-w: clamp(78px, 8vw, 156px);
      --logo-h: clamp(34px, 3.8vw, 64px);
      --gap-x: clamp(18px, 3.2vw, 52px);
      --gap-y: clamp(18px, 2.3vw, 38px);
      --map-w: min(34vw, 520px);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #fff;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(70, 120, 46, .12), transparent 31%),
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, .045), transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.025), transparent 28%, rgba(255,255,255,.018));
      pointer-events: none;
      z-index: 0;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 720px;
      padding: clamp(24px, 3vw, 54px);
      isolation: isolate;
    }
    .logo-grid {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      grid-template-rows: repeat(9, minmax(0, 1fr));
      column-gap: var(--gap-x);
      row-gap: var(--gap-y);
      align-items: center;
      justify-items: center;
      opacity: .96;
    }
    .logo-cell {
      width: var(--logo-w);
      height: var(--logo-h);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn .5s ease forwards;
    }
    .logo-cell img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: grayscale(1) brightness(0) invert(1) drop-shadow(0 0 8px rgba(255,255,255,.06));
    }
    .logo-cell.placeholder {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      color: rgba(255,255,255,.22);
      font-size: 12px;
      letter-spacing: .08em;
    }
    .map-wrap {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -49%);
      width: var(--map-w);
      aspect-ratio: 0.72 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .map-glow {
      position: absolute;
      width: 88%;
      height: 74%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(135, 212, 70, .22), transparent 64%);
      filter: blur(28px);
      opacity: .85;
    }
    .taiwan-map {
      position: relative;
      z-index: 2;
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 26px rgba(154, 220, 80, .24));
    }
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0,0,0,.86);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: .96; transform: translateY(0); }
    }
    @media (max-width: 900px) {
      body { overflow: auto; }
      .stage { width: 1400px; min-height: 850px; }
    }
  </style>
</head>

', '', '', '', '', '', '', '', '', '', '', '', ''];

    const grid = document.getElementById("logoGrid");
    const columns = 16;
    const rows = 9;
    const blocked = new Set();

    for (let r = 3; r <= 7; r++) {
      for (let c = 7; c <= 10; c++) blocked.add(`${r}-${c}`);
    }
    for (let r = 4; r <= 6; r++) {
      blocked.add(`${r}-6`);
      blocked.add(`${r}-11`);
    }

    const positions = [];
    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= columns; c++) {
        if (!blocked.has(`${r}-${c}`)) positions.push([r, c]);
      }
    }

    LOGOS.forEach((src, index) => {
      const [row, col] = positions[index] || [1, 1];
      const cell = document.createElement("div");
      cell.className = "logo-cell";
      cell.style.gridRow = row;
      cell.style.gridColumn = col;
      cell.style.animationDelay = `${Math.min(index * 0.012, 0.8)}s`;

      if (src) {
        const img = document.createElement("img");
        img.src = src;
        img.alt = `logo ${index + 1}`;
        img.loading = "eager";
        cell.appendChild(img);
      } else {
        cell.classList.add("placeholder");
        cell.textContent = `LOGO ${String(index + 1).padStart(3, "0")}`;
      }

      grid.appendChild(cell);
    });
