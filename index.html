    :root{
      --bg:#070b14;
      --panel:#0b1020;
      --panel-2:#10172b;
      --panel-3:#121b31;
      --border:rgba(255,255,255,.08);
      --text:#eaf0ff;
      --muted:#90a0bf;
      --green:#3c7c2c;
      --green2:#5b8a2e;
      --olive:#8a8627;
      --amber:#9a6520;
      --orange:#a94b1c;
      --red:#993219;
      --shadow:0 14px 34px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(180deg,#050912 0%, #08101e 100%);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }

    .topbar{
      height:56px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 16px;
      border-bottom:1px solid var(--border);
      background:rgba(5,9,18,.82);
      backdrop-filter:blur(10px);
      position:sticky;
      top:0;
      z-index:20;
    }
    .tab{
      display:flex;
      align-items:center;
      gap:8px;
      height:38px;
      padding:0 12px;
      border:1px solid var(--border);
      background:#090f1b;
      color:#aebada;
      border-radius:10px 10px 0 0;
      font-size:13px;
      white-space:nowrap;
    }
    .tab.active{
      color:#fff;
      background:#0d1424;
      border-bottom-color:#0d1424;
      box-shadow:inset 0 -2px 0 #d7dde9;
    }

    .page{
      display:grid;
      grid-template-columns: 300px minmax(0,1fr);
      gap:12px;
      padding:12px;
      height:calc(100vh - 56px);
    }

    .sidebar{
      background:linear-gradient(180deg,#090d18 0%, #0b1120 100%);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px 16px;
      overflow:auto;
      box-shadow:var(--shadow);
    }
    .sidebar h1{
      margin:0;
      font-size:16px;
      line-height:1.4;
      font-weight:900;
    }
    .sidebar .sub{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }
    .github{
      color:#d9e4ff;
      text-decoration:none;
      display:inline-block;
      margin-top:4px;
      font-size:13px;
    }

    .metric{
      margin-top:22px;
    }
    .metric-label{
      color:#9aabc8;
      font-size:13px;
      margin-bottom:8px;
    }
    .metric-value{
      font-weight:900;
      letter-spacing:-.04em;
      line-height:1;
    }
    .metric-value.big{
      font-size:56px;
    }
    .metric-value.mid{
      font-size:34px;
    }
    .metric-value.yellow{ color:#d3be45; }

    .section{
      margin-top:26px;
    }
    .section-title{
      color:#a7b5d0;
      font-size:13px;
      margin-bottom:12px;
    }

    .dist-bars{
      display:flex;
      align-items:flex-end;
      gap:4px;
      height:72px;
      padding:4px 2px 2px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .bar{
      flex:1;
      border-radius:3px 3px 0 0;
      opacity:.95;
    }
    .axis{
      display:flex;
      justify-content:space-between;
      color:#7f90af;
      font-size:12px;
      margin-top:8px;
    }

    .legend-list{
      display:grid;
      gap:8px;
    }
    .legend-row{
      display:grid;
      grid-template-columns: 14px 1fr auto auto;
      gap:8px;
      align-items:center;
      font-size:12px;
      color:#dbe5ff;
    }
    .dot{
      width:14px;height:14px;border-radius:2px;
    }
    .legend-row .name{ color:#a7b5d0; }
    .legend-row .val{ min-width:48px; text-align:right; color:#e7efff;}
    .legend-row .pct{ min-width:38px; text-align:right; color:#a7b5d0;}

    .rank-list{
      display:grid;
      gap:8px;
    }
    .rank-item{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      border-radius:12px;
      padding:10px;
      display:grid;
      grid-template-columns:34px 1fr auto;
      gap:10px;
      align-items:center;
    }
    .rank-logo{
      width:34px;height:34px;border-radius:10px;
      background:#fff;border:1px solid rgba(255,255,255,.12);
      object-fit:contain;padding:4px;
    }
    .rank-name{font-size:13px;font-weight:800}
    .rank-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .rank-cap{font-size:12px;color:#dbe5ff;font-weight:800}

    .detail-card{
      margin-top:22px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:12px;
    }
    .detail-head{
      display:grid;
      grid-template-columns:48px 1fr;
      gap:10px;
      align-items:center;
    }
    .detail-logo{
      width:48px;height:48px;border-radius:12px;
      background:#fff;border:1px solid rgba(255,255,255,.12);
      object-fit:contain;padding:5px;
    }
    .detail-name{
      font-size:18px;
      font-weight:900;
      line-height:1.2;
    }
    .detail-sub{
      font-size:12px;color:var(--muted);margin-top:4px
    }
    .mini-grid{
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .mini{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02);
      border-radius:12px;
      padding:10px;
    }
    .mini span{
      display:block;
      font-size:11px;
      color:var(--muted);
      margin-bottom:4px;
    }
    .mini strong{font-size:14px}
    .detail-intro{
      margin-top:10px;
      color:#c2cde3;
      font-size:13px;
      line-height:1.7;
    }

    .main{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .view-header{
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      border:1px solid var(--border);
      background:#0a101d;
      border-radius:14px;
      box-shadow:var(--shadow);
    }
    .view-title{
      font-size:14px;
      color:#dbe5ff;
      font-weight:800;
    }
    .view-note{
      font-size:12px;
      color:#8ea0c0;
    }

    .treemap{
      flex:1;
      min-height:0;
      background:#0a101d;
      border:1px solid var(--border);
      border-radius:18px;
      padding:10px;
      box-shadow:var(--shadow);
      display:grid;
      grid-template-columns:repeat(24, minmax(0,1fr));
      grid-auto-rows:minmax(22px, 1fr);
      gap:3px;
      overflow:auto;
    }

    .tile{
      position:relative;
      border:1px solid rgba(255,255,255,.06);
      border-radius:0;
      overflow:hidden;
      cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;
      transition:transform .14s ease, filter .14s ease, box-shadow .14s ease;
      min-height:54px;
    }
    .tile:hover{
      transform:translateY(-1px);
      filter:brightness(1.05);
      box-shadow:0 10px 18px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.06);
      z-index:2;
    }
    .tile img{
      max-width:84%;
      max-height:52%;
      object-fit:contain;
      filter:contrast(1.04) saturate(1.08);
      opacity:.98;
      pointer-events:none;
    }
    .tile .txt{
      position:absolute;
      inset:8px 8px auto 8px;
      display:flex;
      flex-direction:column;
      gap:2px;
      pointer-events:none;
    }
    .tile .name{
      font-size:12px;
      font-weight:800;
      color:#f5f8ff;
      text-shadow:0 1px 1px rgba(0,0,0,.35);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tile .sub{
      font-size:11px;
      color:rgba(255,255,255,.78);
      text-shadow:0 1px 1px rgba(0,0,0,.28);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tile.tiny .sub{display:none}
    .tile.tiny img{display:none}
    .tile.micro .txt{display:none}
    .tile.micro img{max-height:64%;max-width:92%}
    .tile.selected{
      outline:2px solid rgba(255,255,255,.88);
      outline-offset:-2px;
    }

    @media (max-width: 1100px){
      .page{grid-template-columns: 280px minmax(0,1fr)}
      .treemap{grid-template-columns:repeat(18,minmax(0,1fr))}
    }
    @media (max-width: 900px){
      .page{
        grid-template-columns:1fr;
        height:auto;
      }
      .sidebar{
        max-height:none;
      }
      .main{
        min-height:68vh;
      }
      .treemap{
        grid-template-columns:repeat(12,minmax(0,1fr));
        min-height:900px;
      }
    }
  </style>
</head>

const companies = rawCompanies.map((d, i) => {
  const marketCap = Math.round(d[3] * TWD_TO_CNY);
  return {
    id:"c"+i,
    name:d[0],
    code:d[1],
    industry:d[2],
    marketCap,
    intro:d[4],
    logo:logoMap[d[0]] || "",
    fallback:fallbackLogoMap[d[0]] || "",
  };
}).sort((a,b)=>b.marketCap-a.marketCap);

const totalCap = companies.reduce((s,c)=>s+c.marketCap,0);
companies.forEach(c=>c.share = c.marketCap/totalCap*100);

function formatCap(n){
  if(n >= 10000) return (n/10000).toFixed(1) + "万亿";
  return n.toLocaleString("zh-CN") + "亿";
}

function calcIndustryStats(){
  const map = new Map();
  companies.forEach(c=>{
    if(!map.has(c.industry)) map.set(c.industry, {industry:c.industry, cap:0, count:0});
    const item = map.get(c.industry);
    item.cap += c.marketCap;
    item.count += 1;
  });
  return [...map.values()].sort((a,b)=>b.cap-a.cap);
}

function renderSidebar(){
  document.getElementById("totalCap").textContent = formatCap(totalCap);
  const semiCap = companies.filter(c=>c.industry.includes("半导体")).reduce((s,c)=>s+c.marketCap,0);
  document.getElementById("semiShare").textContent = ((semiCap/totalCap)*100).toFixed(1) + "%";

  const stats = calcIndustryStats();
  const bars = document.getElementById("distBars");
  bars.innerHTML = "";
  const topBars = stats.slice(0, 10);
  const maxCap = Math.max(...topBars.map(d=>d.cap));
  topBars.forEach(d=>{
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = Math.max(8, d.cap / maxCap * 100) + "%";
    bar.style.background = colors[d.industry] || "#6f7c94";
    bar.title = `${d.industry}：${formatCap(d.cap)}`;
    bars.appendChild(bar);
  });

  const legend = document.getElementById("legendList");
  legend.innerHTML = "";
  stats.slice(0, 8).forEach(d=>{
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `
      <div class="dot" style="background:${colors[d.industry] || '#6f7c94'}"></div>
      <div class="name">${d.industry}</div>
      <div class="val">${formatCap(d.cap)}</div>
      <div class="pct">${(d.cap/totalCap*100).toFixed(0)}%</div>
    `;
    legend.appendChild(row);
  });

  const topList = document.getElementById("topList");
  topList.innerHTML = "";
  companies.slice(0,5).forEach(c=>{
    const el = document.createElement("div");
    el.className = "rank-item";
    el.innerHTML = `
      <img class="rank-logo" src="${c.logo}" alt="${c.name}" data-fallback="${c.fallback}">
      <div>
        <div class="rank-name">${c.name}</div>
        <div class="rank-sub">${c.code} · ${c.industry}</div>
      </div>
      <div class="rank-cap">${formatCap(c.marketCap)}</div>
    `;
    topList.appendChild(el);
  });
  topList.querySelectorAll("img").forEach(img=>{
    img.onerror = function(){
      if(!this.dataset.retry){
        this.dataset.retry = "1";
        this.src = this.dataset.fallback || "";
      } else {
        this.style.display = "none";
      }
    };
  });
}

function spanForIndex(i){
  if(i === 0) return {c:9,r:8};
  if(i === 1) return {c:5,r:4};
  if(i === 2) return {c:4,r:4};
  if(i === 3) return {c:4,r:4};
  if(i < 8) return {c:3,r:3};
  if(i < 20) return {c:3,r:2};
  if(i < 40) return {c:2,r:2};
  if(i < 75) return {c:2,r:1};
  return {c:1,r:1};
}

function tileSizeClass(i){
  if(i < 20) return "";
  if(i < 60) return " tiny";
  return " micro";
}

function renderTreemap(){
  const wrap = document.getElementById("treemap");
  wrap.innerHTML = "";
  companies.forEach((c, i)=>{
    const tile = document.createElement("button");
    const span = spanForIndex(i);
    tile.className = "tile" + tileSizeClass(i);
    tile.style.gridColumn = `span ${span.c}`;
    tile.style.gridRow = `span ${span.r}`;
    tile.style.background = colors[c.industry] || "#6e7584";
    tile.dataset.id = c.id;
    tile.innerHTML = `
      <div class="txt">
        <div class="name">${c.name}</div>
        <div class="sub">${c.code} · ${formatCap(c.marketCap)}</div>
      </div>
      <img src="${c.logo}" alt="${c.name}" data-fallback="${c.fallback}">
    `;
    tile.addEventListener("click", ()=>selectCompany(c.id));
    wrap.appendChild(tile);
  });

  wrap.querySelectorAll("img").forEach(img=>{
    img.onerror = function(){
      if(!this.dataset.retry){
        this.dataset.retry = "1";
        this.src = this.dataset.fallback || "";
      } else {
        this.style.display = "none";
      }
    };
  });
}

function selectCompany(id){
  const c = companies.find(x=>x.id===id);
  if(!c) return;
  document.querySelectorAll(".tile").forEach(el=>el.classList.toggle("selected", el.dataset.id===id));

  const logo = document.getElementById("detailLogo");
  logo.dataset.retry = "";
  logo.src = c.logo;
  logo.onerror = function(){
    if(!this.dataset.retry){
      this.dataset.retry = "1";
      this.src = c.fallback || "";
    } else {
      this.style.display = "none";
    }
  };
  logo.style.display = "block";

  document.getElementById("detailName").textContent = c.name;
  document.getElementById("detailSub").textContent = `${c.code} · ${c.industry}`;
  document.getElementById("detailCap").textContent = formatCap(c.marketCap) + " 人民币";
  document.getElementById("detailShare").textContent = c.share.toFixed(2) + "%";
  document.getElementById("detailCode").textContent = c.code;
  document.getElementById("detailIndustry").textContent = c.industry;
  document.getElementById("detailIntro").textContent = c.intro;
}

renderSidebar();
renderTreemap();
selectCompany(companies[0].id);
</script>
</body>
</html>
