<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taiwan Logo Wall Preview</title>
  <style>
    :root {
      --bg: #04070d;
      --grid-col: 16;
      --grid-row: 9;
      --logo-w: clamp(86px, 7vw, 150px);
      --logo-h: clamp(34px, 3vw, 58px);
      --gap-x: clamp(16px, 1.8vw, 32px);
      --gap-y: clamp(14px, 1.6vw, 28px);
      --map-w: min(23vw, 360px);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(124, 196, 80, 0.14), transparent 28%),
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.02), transparent 45%),
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 20%);
      pointer-events: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 30px 28px;
    }

    .grid {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(var(--grid-col), minmax(0, 1fr));
      grid-template-rows: repeat(var(--grid-row), minmax(0, 1fr));
      column-gap: var(--gap-x);
      row-gap: var(--gap-y);
      align-items: center;
      justify-items: center;
    }

    .logo {
      width: var(--logo-w);
      height: var(--logo-h);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.04));
    }

    .logo.placeholder {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: rgba(255,255,255,0.22);
      font-size: 11px;
      letter-spacing: .08em;
    }

    .map-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: var(--map-w);
      z-index: 5;
      pointer-events: none;
    }

    .map-glow {
      position: absolute;
      inset: 12% 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(149, 222, 96, .24), transparent 65%);
      filter: blur(24px);
    }

    .map {
      position: relative;
      width: 100%;
      display: block;
      filter: drop-shadow(0 0 24px rgba(124, 196, 80, 0.25));
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 110px rgba(0,0,0,0.82);
    }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .stage { width: 1450px; height: 860px; }
    }
  </style>
</head>

    const grid = document.getElementById('grid');

    // Block a center region so logos wrap around the Taiwan map like the sample.
    const blocked = new Set();
    for (let r = 3; r <= 7; r++) {
      for (let c = 7; c <= 10; c++) blocked.add(`${r}-${c}`);
    }
    for (let r = 4; r <= 6; r++) {
      blocked.add(`${r}-6`);
      blocked.add(`${r}-11`);
    }

    const positions = [];
    for (let r = 1; r <= 9; r++) {
      for (let c = 1; c <= 16; c++) {
        if (!blocked.has(`${r}-${c}`)) positions.push([r, c]);
      }
    }

    LOGOS.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'logo';
      const [row, col] = positions[i] || [1, 1];
      div.style.gridRow = row;
      div.style.gridColumn = col;

      if (src) {
        const img = document.createElement('img');
        img.src = src;
        img.alt = `logo ${i + 1}`;
        div.appendChild(img);
      } else {
        div.classList.add('placeholder');
        div.textContent = `LOGO ${String(i + 1).padStart(3, '0')}`;
      }

      grid.appendChild(div);
    });
