<title>Taiwan Logo Wall</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
  color: #222;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

body {
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 720px;
  background: #fff;
  overflow: hidden;
}

.logo {
  position: absolute;
  width: clamp(60px, 6.3vw, 120px);
  height: clamp(26px, 4.3vh, 52px);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  overflow: hidden;
  padding: 2px 3px;
}

.logo img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

.map-wrap {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  width: min(22vw, 320px);
  z-index: 4;
  pointer-events: none;
}

.map {
  width: 100%;
  display: block;
}

@media (max-width: 900px) {
  .logo {
    width: clamp(54px, 8vw, 90px);
    height: clamp(24px, 5.2vw, 42px);
  }

  .map-wrap {
    width: min(28vw, 210px);
  }
}

@media (max-width: 420px) {
  .logo {
    width: clamp(48px, 8.8vw, 78px);
    height: clamp(20px, 5.2vw, 36px);
  }

  .map-wrap {
    width: min(32vw, 170px);
  }
}
</style>
