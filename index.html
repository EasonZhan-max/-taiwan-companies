<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Logo Wall</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  color: #222;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

body {
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 720px;
  background: #ffffff;
  overflow: hidden;
}

.logo {
  position: absolute;
  width: clamp(70px, 7vw, 128px);
  height: clamp(29px, 4.5vh, 56px);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  overflow: hidden;
  padding: 2px 4px;
  z-index: 2;
}

.logo.priority {
  width: clamp(84px, 8.1vw, 154px);
  height: clamp(36px, 5.3vh, 70px);
  z-index: 3;
}

.logo.highlight {
  width: clamp(76px, 7.4vw, 138px);
  height: clamp(32px, 4.9vh, 60px);
  z-index: 2;
}

.logo img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

.map-wrap {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  width: min(18vw, 260px);
  z-index: 1;
  pointer-events: none;
}

.map {
  width: 100%;
  display: block;
}

@media (max-width: 1100px) {
  .logo {
    width: clamp(52px, 7vw, 94px);
    height: clamp(22px, 3.9vh, 40px);
  }

  .logo.priority {
    width: clamp(62px, 8.2vw, 110px);
    height: clamp(26px, 4.6vh, 48px);
  }

  .logo.highlight {
    width: clamp(56px, 7.5vw, 100px);
    height: clamp(24px, 4.2vh, 44px);
  }

  .map-wrap {
    width: min(20vw, 190px);
  }
}

@media (max-width: 700px) {
  .logo {
    width: clamp(38px, 8.2vw, 68px);
    height: clamp(17px, 3.1vh, 30px);
  }

  .logo.priority {
    width: clamp(46px, 9vw, 82px);
    height: clamp(20px, 3.7vh, 36px);
  }

  .logo.highlight {
    width: clamp(42px, 8.5vw, 76px);
    height: clamp(18px, 3.4vh, 32px);
  }

  .map-wrap {
    width: min(24vw, 140px);
  }
}
</style>
