<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台湾公司市值Logo拼贴图</title>
  <style>
    :root{
      --bg:#eef2f7;
      --card:#ffffff;
      --border:#cfd6df;
      --text:#182235;
      --muted:#68768a;
      --blue:#0d47a1;
      --blue-2:#2d63d8;
      --shadow:0 14px 30px rgba(34,52,84,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:linear-gradient(180deg,#f5f7fb,#edf1f7);
      color:var(--text);
    }
    .page{
      width:min(1500px, calc(100% - 24px));
      margin:0 auto;
      padding:18px 0 28px;
    }
    .hero{
      background:rgba(255,255,255,.8);
      border:1px solid #dfe5ee;
      border-radius:22px;
      padding:18px 20px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(14px);
    }
    h1{
      margin:0;
      font-size:clamp(28px,4vw,42px);
      letter-spacing:-.03em;
    }
    .sub{
      margin-top:8px;
      color:var(--muted);
      line-height:1.75;
      font-size:14px;
    }
    .note{
      margin-top:12px;
      display:inline-flex;
      gap:8px;
      padding:8px 12px;
      background:#fff6dd;
      color:#8d5a00;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
    }
    .stats{
      margin:16px 0 14px;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
    }
    .stat{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px;
      box-shadow:var(--shadow);
      min-height:108px;
    }
    .stat .k{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .stat .v{
      margin-top:8px;
      font-size:clamp(24px,3vw,38px);
      font-weight:900;
      letter-spacing:-.04em;
    }
    .stat .s{
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
    }

    .board-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:12px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .board-wrap{
      display:grid;
      grid-template-columns: 1fr 300px;
      gap:14px;
      align-items:start;
    }

    .logo-board{
      position:relative;
      min-height:1320px;
      display:grid;
      grid-template-columns:repeat(7,1fr);
      grid-auto-rows:90px;
      gap:8px;
      background:#e9edf2;
      padding:8px;
      border-radius:18px;
      border:1px solid #d5dbe4;
      overflow:hidden;
    }
    .tile{
      position:relative;
      background:#fff;
      border:1.5px solid #bfc8d3;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(40,53,77,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:6px;
      transition:transform .18s ease, box-shadow .18s ease;
      cursor:pointer;
    }
    .tile:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 20px rgba(40,53,77,.16);
      z-index:5;
    }
    .tile img{
      max-width:96%;
      max-height:86%;
      object-fit:contain;
      image-rendering:auto;
      filter:contrast(1.04) saturate(1.08);
    }
    .tile .label{
      position:absolute;
      left:8px;
      right:8px;
      bottom:6px;
      font-size:11px;
      line-height:1.2;
      text-align:center;
      font-weight:800;
      color:#243247;
      text-shadow:0 1px 0 rgba(255,255,255,.75);
      background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.82));
      padding-top:10px;
    }
    .size-xl{grid-column:span 2; grid-row:span 2;}
    .size-l{grid-column:span 2; grid-row:span 1;}
    .size-m{grid-column:span 1; grid-row:span 1;}
    .size-s{grid-column:span 1; grid-row:span 1;}

    .side-panel{
      background:#f7f9fc;
      border:1px solid #d7dee8;
      border-radius:18px;
      padding:14px;
      position:sticky;
      top:12px;
    }
    .side-title{
      font-size:20px;
      font-weight:900;
      margin:0 0 10px;
      letter-spacing:-.03em;
    }
    .tip{
      color:var(--muted);
      font-size:13px;
      line-height:1.7;
      margin-bottom:12px;
    }
    .detail-box{
      border:1px solid #d8dfe8;
      background:#fff;
      border-radius:16px;
      padding:14px;
    }
    .detail-head{
      display:flex; gap:12px; align-items:center;
      margin-bottom:10px;
    }
    .detail-logo{
      width:56px; height:56px; border-radius:14px; border:1px solid #d6dce6;
      padding:6px; object-fit:contain; background:#fff;
    }
    .detail-name{
      font-size:22px; font-weight:900; letter-spacing:-.03em;
    }
    .detail-code{
      color:var(--muted); font-size:13px; font-weight:800; margin-top:2px;
    }
    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    .meta{
      border:1px solid #dce3ec;
      border-radius:14px;
      padding:8px;
      background:#fbfcfe;
    }
    .meta span{
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-bottom:4px;
      font-weight:700;
    }
    .meta strong{
      font-size:16px;
    }
    .intro{
      margin-top:12px;
      color:#4f5d70;
      line-height:1.75;
      font-size:14px;
    }

    @media (max-width: 1180px){
      .board-wrap{grid-template-columns:1fr;}
      .logo-board{min-height:1020px; grid-auto-rows:74px;}
      .side-panel{position:static}
    }
    @media (max-width: 760px){
      .page{width:min(100% - 14px,1500px)}
      .stats{grid-template-columns:1fr 1fr}
      .logo-board{
        grid-template-columns:repeat(5,1fr);
        grid-auto-rows:72px;
        min-height:900px;
        gap:6px;
        padding:6px;
      }
    }
    @media (max-width: 480px){
      .stats{grid-template-columns:1fr}
      .logo-board{
        grid-template-columns:repeat(4,1fr);
        grid-auto-rows:68px;
        min-height:1120px;
      }
      .label{font-size:10px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>台湾公司市值Logo拼贴图</h1>
      <div class="sub">
        参考你提供的图片风格：使用公司 Logo 磁贴拼贴展示，整体更像品牌拼贴墙海报，而不是普通矩形树状图。
      </div>
      <div class="note">⚠️ 数据为示例估算；市值按 1 新台币≈0.22 人民币换算为人民币亿元，仅用于可视化展示。</div>
    </section>

    <section class="stats">
      <article class="stat"><div class="k">总市值</div><div id="totalCap" class="v">-</div><div class="s">单位：人民币亿元</div></article>
      <article class="stat"><div class="k">公司数量</div><div id="companyCount" class="v">-</div><div class="s">当前展示公司</div></article>
      <article class="stat"><div class="k">最大市值公司</div><div id="largestCompany" class="v">-</div><div id="largestSub" class="s">-</div></article>
      <article class="stat"><div class="k">半导体产业占比</div><div id="semiShare" class="v">-</div><div class="s">按当前数据计算</div></article>
    </section>

    <section class="board-card">
      <div class="board-wrap">
        <div id="logoBoard" class="logo-board">

        <aside class="side-panel">
          <h2 class="side-title">公司信息</h2>
          <div class="tip">点击左侧 Logo 磁贴，可查看该公司的股票代码、行业、市值与简介。整体风格已调整为纯 Logo 拼贴墙样式，Logo 已优先切换为更清晰的高清品牌图源。</div>
          <div id="detailBox" class="detail-box">
            <div class="detail-head">
              <img id="detailLogo" class="detail-logo" alt="公司logo" />
              <div>
                <div id="detailName" class="detail-name">台积电</div>
                <div id="detailCode" class="detail-code">2330 · 半导体</div>
              </div>
            </div>
            <div class="meta-grid">
              <div class="meta"><span>市值</span><strong id="detailCap">-</strong></div>
              <div class="meta"><span>市值占比</span><strong id="detailShare">-</strong></div>
              <div class="meta"><span>股票代码</span><strong id="detailStock">-</strong></div>
              <div class="meta"><span>所属行业</span><strong id="detailIndustry">-</strong></div>
            </div>
            <div id="detailIntro" class="intro">-</div>
          </div>
        </aside>
      </div>
    </section>
  </main>

    }).sort((a,b)=>b.marketCap-a.marketCap);

    const totalCap = companies.reduce((s,c)=>s+c.marketCap,0);
    companies.forEach(c => c.share = c.marketCap / totalCap * 100);

    const board = document.getElementById("logoBoard");

    function formatCap(num){
      if(num >= 10000) return (num/10000).toFixed(1) + " 万亿";
      return num.toLocaleString("zh-CN") + " 亿";
    }

    function getSizeClass(index, cap){
      if(index === 0) return "size-xl";
      if(index < 10) return "size-l";
      if(index < 28) return index % 3 === 0 ? "size-l" : "size-m";
      return "size-s";
    }

    function renderStats(){
      const largest = companies[0];
      const semi = companies.filter(x => x.industry.includes("半导体")).reduce((s,x)=>s+x.marketCap,0);
      document.getElementById("totalCap").textContent = formatCap(totalCap);
      document.getElementById("companyCount").textContent = companies.length + " 家";
      document.getElementById("largestCompany").textContent = largest.name;
      document.getElementById("largestSub").textContent = `${largest.code} · ${formatCap(largest.marketCap)}`;
      document.getElementById("semiShare").textContent = ((semi/totalCap)*100).toFixed(1) + "%";
    }

    function renderTiles(){
      companies.forEach((c, i) => {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = `tile ${getSizeClass(i, c.marketCap)}`;
        tile.setAttribute("aria-label", `${c.name} ${c.code}`);
        tile.innerHTML = `
          <img src="${c.logo}" data-fallback="${c.fallbackLogo}" alt="${c.name} logo"
               onerror="if(!this.dataset.retry){this.dataset.retry='1'; this.src=this.dataset.fallback;}else{this.style.display='none'; this.parentNode.innerHTML='<div style=&quot;font-weight:900;font-size:20px;color:#1f2f4a;text-align:center;line-height:1.3&quot;>${c.name}</div><div class=&quot;label&quot;>${c.name}</div>'; }">
          <div class="label">${c.name}</div>
        `;
        tile.addEventListener("click", ()=> setDetail(c));
        board.appendChild(tile);
      });
    }

    function setDetail(c){
      const logo = document.getElementById("detailLogo");
      logo.dataset.retry = "";
      logo.src = c.logo;
      logo.onerror = () => {
        if(!logo.dataset.retry){
          logo.dataset.retry = "1";
          logo.src = c.fallbackLogo || "";
        }else{
          logo.style.display = "none";
        }
      };
      logo.style.display = "block";
      document.getElementById("detailName").textContent = c.name;
      document.getElementById("detailCode").textContent = `${c.code} · ${c.industry}`;
      document.getElementById("detailCap").textContent = formatCap(c.marketCap) + " 人民币";
      document.getElementById("detailShare").textContent = c.share.toFixed(2) + "%";
      document.getElementById("detailStock").textContent = c.code;
      document.getElementById("detailIndustry").textContent = c.industry;
      document.getElementById("detailIntro").textContent = c.intro;
    }

    renderStats();
    renderTiles();
    setDetail(companies[0]);
  </script>
</body>
</html>
