<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taiwan Logo Wall Preview</title>
  <style>
    :root {
      --bg: #ffffff;
      --grid-col: 14;
      --grid-row: 8;
      --logo-w: clamp(88px, 8vw, 180px);
      --logo-h: clamp(34px, 3.2vw, 72px);
      --gap-x: clamp(18px, 2vw, 34px);
      --gap-y: clamp(16px, 1.8vw, 30px);
      --map-w: min(30vw, 450px);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: #ffffff;
      pointer-events: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 30px 28px;
    }

    .grid {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(var(--grid-col), minmax(0, 1fr));
      grid-template-rows: repeat(var(--grid-row), minmax(0, 1fr));
      column-gap: var(--gap-x);
      row-gap: var(--gap-y);
      align-items: center;
      justify-items: center;
    }

    .logo {
      width: 100%;
      max-width: var(--logo-w);
      height: var(--logo-h);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2px 4px;
    }

    .logo img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.04));
    }

    .logo.placeholder {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 8px;
      color: rgba(0,0,0,0.22);
      font-size: 11px;
      letter-spacing: .08em;
    }

    .map-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: var(--map-w);
      z-index: 5;
      pointer-events: none;
    }

    .map-glow {
      display: none;
    }

    .map {
      position: relative;
      width: 100%;
      display: block;
      filter: none;
    }

    .vignette {
      display: none;
    }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .stage { width: 1450px; height: 860px; }
    }
  </style>
</head>

    const grid = document.getElementById('grid');

    // Block a center region so logos wrap around the Taiwan map like the sample.
    const blocked = new Set();
    for (let r = 3; r <= 6; r++) {
      for (let c = 6; c <= 9; c++) blocked.add(`${r}-${c}`);
    }
    for (let r = 4; r <= 5; r++) {
      blocked.add(`${r}-5`);
      blocked.add(`${r}-10`);
    }

    function range(start, end) {
      const arr = [];
      for (let i = start; i <= end; i++) arr.push(i);
      return arr;
    }

    const orderRows = [
      1, 2, 7, 8,   // top first, then bottom
      3, 6, 4, 5    // then middle outer bands
    ];
    const orderCols = [
      1,2,3,4,5, 10,11,12,13,14,
      6,9, 7,8
    ];

    const positions = [];
    for (const r of orderRows) {
      for (const c of orderCols) {
        if (!blocked.has(`${r}-${c}`)) positions.push([r, c]);
      }
    }

    LOGOS.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'logo';
      const [row, col] = positions[i] || [1, 1];
      div.style.gridRow = row;
      div.style.gridColumn = col;

      if (src) {
        const img = document.createElement('img');
        img.src = src;
        img.alt = `logo ${i + 1}`;
        div.appendChild(img);
      } else {
        div.classList.add('placeholder');
        div.textContent = `LOGO ${String(i + 1).padStart(3, '0')}`;
      }

      grid.appendChild(div);
    });
