<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Taiwan Logo Wall</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #fff;
  color: #222;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

body {
  overflow: auto;
}

.stage {
  position: relative;
  width: 1920px;
  height: 1080px;
  margin: 0 auto;
  background: #fff;
  overflow: hidden;
}

.logo {
  position: absolute;
  width: 138px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.logo img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

.map-wrap {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  width: 390px;
  z-index: 4;
  pointer-events: none;
}

.map {
  width: 100%;
  display: block;
}

.mobile-stage {
  display: none;
  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
  background: #fff;
  min-height: 100vh;
}

.mobile-map-wrap {
  display: flex;
  justify-content: center;
  padding-bottom: 18px;
}

.mobile-map {
  width: min(74vw, 330px);
  max-width: 100%;
  display: block;
}

.mobile-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.mobile-card {
  min-height: 118px;
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 14px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.03);
}

.mobile-card img {
  max-width: 100%;
  max-height: 88px;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
}

@media (max-width: 900px) {
  .stage {
    display: none;
  }
  .mobile-stage {
    display: block;
  }
}

@media (max-width: 420px) {
  .mobile-grid {
    grid-template-columns: 1fr;
  }
  .mobile-card {
    min-height: 124px;
  }
  .mobile-card img {
    max-height: 94px;
  }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="map-wrap">
    <img class="map" src="./assets/taiwan-map.jpg" alt="Taiwan map" />
  </div>
</main>

<main class="mobile-stage">
  <div class="mobile-map-wrap">
    <img class="mobile-map" src="./assets/taiwan-map.jpg" alt="Taiwan map" />
  </div>
  <section class="mobile-grid" id="mobileGrid"></section>
</main>

</body>
</html>
