<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiwan Logo Wall</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  color: #222;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

body {
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 700px;
  background: #ffffff;
  overflow: hidden;
}

.wall {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(11, minmax(0, 1fr));
  grid-template-rows: repeat(10, minmax(0, 1fr));
  padding: clamp(18px, 2vw, 28px);
  column-gap: clamp(10px, 0.95vw, 18px);
  row-gap: clamp(8px, 1vh, 14px);
  align-items: center;
  justify-items: center;
  z-index: 2;
}

.logo {
  width: 100%;
  max-width: clamp(80px, 7.1vw, 138px);
  height: clamp(32px, 4.8vh, 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 2px 4px;
}

.logo img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  image-rendering: -webkit-optimize-contrast;
}

.map-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(21vw, 290px);
  z-index: 1;
  pointer-events: none;
}

.map {
  width: 100%;
  display: block;
}

.slot-r1{grid-row:1;}
.slot-r2{grid-row:2;}
.slot-r3{grid-row:3;}
.slot-r4{grid-row:4;}
.slot-r5{grid-row:5;}
.slot-r6{grid-row:6;}
.slot-r7{grid-row:7;}
.slot-r8{grid-row:8;}
.slot-r9{grid-row:9;}
.slot-r10{grid-row:10;}
.slot-c1{grid-column:1;}
.slot-c2{grid-column:2;}
.slot-c3{grid-column:3;}
.slot-c4{grid-column:4;}
.slot-c5{grid-column:5;}
.slot-c6{grid-column:6;}
.slot-c7{grid-column:7;}
.slot-c8{grid-column:8;}
.slot-c9{grid-column:9;}
.slot-c10{grid-column:10;}
.slot-c11{grid-column:11;}

@media (max-width: 1100px) {
  .wall {
    padding: 14px;
    column-gap: 8px;
    row-gap: 8px;
  }

  .logo {
    max-width: clamp(58px, 7.8vw, 100px);
    height: clamp(24px, 4.2vh, 44px);
  }

  .map-wrap {
    width: min(24vw, 220px);
  }
}

@media (max-width: 700px) {
  .wall {
    padding: 10px;
    column-gap: 5px;
    row-gap: 6px;
  }

  .logo {
    max-width: clamp(40px, 8.4vw, 72px);
    height: clamp(18px, 3.2vh, 30px);
  }

  .map-wrap {
    width: min(28vw, 150px);
  }
}

.search-panel {
  position: fixed;
  left: 50%;
  bottom: max(10px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(760px, calc(100vw - 28px));
  z-index: 9999;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.96);
  border: 1px solid rgba(0,0,0,.16);
  border-radius: 999px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12);
  padding: 8px 12px;
  backdrop-filter: blur(8px);
}

.search-box input {
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 15px;
  color: #111;
}

.search-count {
  flex: 0 0 auto;
  color: #666;
  font-size: 12px;
  white-space: nowrap;
}

.search-results {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  bottom: 54px;
  max-height: min(360px, 48vh);
  overflow: auto;
  background: rgba(255,255,255,0.98);
  border: 1px solid rgba(0,0,0,.12);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.15);
  padding: 8px;
}

.search-results.active {
  display: block;
}

.result-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  border: 0;
  background: transparent;
  border-radius: 10px;
  padding: 9px 10px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  color: #111;
}

.result-item:hover {
  background: rgba(0,0,0,.06);
}

.result-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.result-name {
  font-weight: 700;
}

.result-alias {
  color: #666;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.result-tag {
  flex: 0 0 auto;
  font-size: 12px;
  color: #555;
  background: rgba(0,0,0,.06);
  border-radius: 999px;
  padding: 3px 8px;
}

.logo.search-hit {
  outline: 3px solid #ff3b30;
  outline-offset: 6px;
  border-radius: 10px;
  z-index: 9998;
  animation: hitPulse 1.2s ease-in-out 2;
}

@keyframes hitPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

@media (max-width: 700px) {
  .search-panel {
    width: calc(100vw - 20px);
  }
  .search-box input {
    font-size: 14px;
  }
  .search-results {
    bottom: 50px;
  }
}

</style>
</head>

const count = document.getElementById('searchCount');

function normalizeText(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, '');
}

function clearHits() {
  document.querySelectorAll('.logo.search-hit').forEach(el => el.classList.remove('search-hit'));
}

function focusLogo(file) {
  clearHits();
  if (!file) return;
  const img = document.querySelector(`img[src$="${file}"]`);
  if (!img) return;
  const logo = img.closest('.logo');
  if (!logo) return;
  logo.classList.add('search-hit');
  setTimeout(() => logo.classList.remove('search-hit'), 2600);
}

function renderResults(q) {
  const key = normalizeText(q);
  if (!key) {
    results.classList.remove('active');
    results.innerHTML = '';
    count.textContent = `${SEARCH_DATA.length} 家`;
    clearHits();
    return;
  }

  const matched = SEARCH_DATA.filter(item => {
    const haystack = normalizeText([item.name, ...(item.aliases || [])].join(' '));
    return haystack.includes(key);
  }).slice(0, 20);

  count.textContent = `${matched.length} / ${SEARCH_DATA.length}`;

  if (!matched.length) {
    results.classList.add('active');
    results.innerHTML = '<div class="result-item"><div class="result-main"><span class="result-name">没有找到匹配公司</span><span class="result-alias">可以换繁体/简体、中文/英文再试</span></div></div>';
    return;
  }

  results.classList.add('active');
  results.innerHTML = matched.map((item, idx) => `
    <button class="result-item" type="button" data-index="${idx}">
      <span class="result-main">
        <span class="result-name">${item.name}</span>
        <span class="result-alias">${(item.aliases || []).join(' / ') || '&nbsp;'}</span>
      </span>
      <span class="result-tag">${item.logo ? '图中有 logo' : item.category}</span>
    </button>
  `).join('');

  results.querySelectorAll('.result-item').forEach((btn, idx) => {
    btn.addEventListener('click', () => {
      const item = matched[idx];
      input.value = item.name;
      results.classList.remove('active');
      count.textContent = item.logo ? '已定位' : item.category;
      focusLogo(item.logo);
    });
  });
}

input.addEventListener('input', e => renderResults(e.target.value));
input.addEventListener('focus', e => renderResults(e.target.value));
document.addEventListener('click', e => {
  if (!e.target.closest('.search-panel')) {
    results.classList.remove('active');
  }
});
</script>

</body>
</html>
